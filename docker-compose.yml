services:
  peers-broker:
    image: oven/bun:latest
    working_dir: /app
    volumes:
      - ./vendor/claude-peers-mcp:/app:ro
      - peers-data:/data
    command: bun run broker.ts
    ports:
      - "7899:7899"
    restart: unless-stopped

  mempalace:
    build: ./vendor/mempalace-sse
    volumes:
      - mempalace-data:/data
    ports:
      - "127.0.0.1:3334:3334"  # Bind to localhost by default; for LAN worker access, change to "0.0.0.0:3334:3334"
    environment:
      - MEMPALACE_PATH=/data/palace
      - MEMPALACE_PORT=3334
    restart: unless-stopped

volumes:
  peers-data:
  mempalace-data:
