services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pixelagents
      POSTGRES_PASSWORD: pixelagents
      POSTGRES_DB: pixelagents
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelagents -d pixelagents"]
      interval: 5s
      timeout: 5s
      retries: 5

  peers-broker:
    image: oven/bun:latest
    working_dir: /app
    volumes:
      - ./vendor/claude-peers-mcp:/app:ro
      - peers-data:/data
    command: bun run broker.ts
    ports:
      - "7899:7899"
    restart: unless-stopped

  mempalace:
    build: ./vendor/mempalace-sse
    volumes:
      - mempalace-data:/data
    ports:
      - "3334:3334"  # Exposed on all interfaces so remote workers can reach it; no auth layer yet (see plans/05-shared-memory-service.md)
    environment:
      - MEMPALACE_PATH=/data/palace
      - MEMPALACE_PORT=3334
    restart: unless-stopped

volumes:
  postgres-data:
  peers-data:
  mempalace-data:
